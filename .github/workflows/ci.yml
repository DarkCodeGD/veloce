name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # Headless Chromium + the built render page: lint measurements and slide previews are
      # tested for real, not skipped (VELOCE_REQUIRE_BROWSER makes a missing browser fail).
      - run: pnpm --filter @veloce/server exec playwright-core install --with-deps chromium-headless-shell
      - run: pnpm build:editor

      - run: pnpm test
        env:
          VELOCE_REQUIRE_BROWSER: "1"

      # Visual regression failures leave the actual and diff images here (tests/visual).
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: tests/visual/.output/
          if-no-files-found: ignore
